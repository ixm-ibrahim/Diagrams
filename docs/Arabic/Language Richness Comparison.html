[1,98,"English has roughly 400 million first-language speakers plus approximately 1.1 billion second-language speakers, totaling about 1.5 billion. It is the official language of 67 or more countries, accounts for roughly 60% of internet content, and sees roughly 500,000 new books published per year. It serves as the global lingua franca of science, business, aviation, diplomacy, and technology. Some argue that English dominance is a product of imperialism rather than intrinsic virtue, and this is historically accurate — but regardless of WHY English is dominant, the fact of dominance is what vitality measures. More people are learning English right now than any other language, and more content is produced in it than in any other language. By any vitality metric, English is first and it is not close."],
[7,60,"Russian has roughly 150 million first-language speakers plus about 100 million second-language speakers, totaling approximately 250 million across four countries where it holds official status. Literary and cultural output remains major. However, Russian's global influence has been declining since the Soviet era — former Soviet states are shifting to national languages, and global study of Russian has diminished since the 1990s. Internet presence is about 6%. Russian is still a major world language by any measure, but the trajectory is downward, which constrains its vitality score."],
[8,55,"Japanese has roughly 125 million speakers, almost entirely first-language, and enormous media output: approximately 350 anime television series per year, roughly 6,000 manga volumes per year, and a major gaming industry. Cultural influence is outsized relative to speaker count. However, Japan's aging population (fertility rate approximately 1.2) and extreme geographic concentration (over 99% of speakers live in Japan) mean the speaker base is shrinking. The language is studied by over 4 million people globally but spoken natively by fewer people each decade. Cultural reach is enormous; demographic trajectory is concerning."],
[3,86,"Spanish has roughly 475 million first-language speakers plus about 75 million second-language speakers, totaling approximately 550 million across 20 or more countries. It is the second most-studied language globally, and demographic growth driven by Latin America is pushing the speaker base steadily higher. Some note that Spanish is growing faster than English in first-language speakers, which is true — Latin American population growth drives this. Spanish is the most vital language after English and Mandarin by most combined measures: speaker count, geographic spread, media output, and growth trajectory."],
[10,44,"German has roughly 76 million first-language speakers plus about 30 million second-language speakers, totaling approximately 100 million across six countries. A strong economy maintains some global relevance. However, German is declining as an international language — fewer people study it globally, and English dominates in EU institutions despite German being the most spoken first language in the European Union. The score reflects regional strength but global diminishment."],
[6,70,"French has roughly 80 million first-language speakers but approximately 230 million second-language speakers, totaling over 300 million across 29 or more countries. It is projected to reach roughly 700 million speakers by 2050, driven primarily by explosive population growth in francophone Africa. It is the second most-taught language globally. Some argue French is dying outside Africa, and its decline in Europe as an international language is real — but the African growth trajectory is genuine and transformative. If the 700-million projection materializes, French will become one of the three most-spoken languages on Earth. No other European language has a comparable growth story."],
[13,35,"Tamil has roughly 80 million speakers with major presence in Tamil Nadu (India) and Sri Lanka, plus a diaspora in Malaysia, Singapore, the United Kingdom, and Canada. Kollywood produces approximately 300 films per year, and the literary scene remains vibrant. Tamil is stable but geographically constrained — it lacks the international institutional support of French, Spanish, or Arabic, and its speaker growth is modest. The community is passionate and culturally productive but regionally limited."],
[9,50,"Korean has roughly 80 million speakers across two countries (South Korea and North Korea). The Hallyu wave — K-pop, K-drama, and K-cinema — gives Korean outsized cultural influence relative to its speaker base. Approximately 16 million people are currently studying Korean worldwide, making it the fastest-growing language-learning trend globally. Some argue Korean's cultural influence should push it higher, and the cultural reach is indeed enormous — but the speaker base is small (80 million) compared to Hindi-Urdu (600 million) or Arabic (420 million). The Hallyu effect may significantly change this ranking within 10 to 20 years."],
[11,40,"Turkish has roughly 80 million speakers with official status in Turkey and the Turkish Republic of Northern Cyprus. Turkish television dramas are exported to over 150 countries, representing a surprisingly large media influence. Turkic language family connections extend across Central Asia. The media export phenomenon is real but does not translate directly into speaker growth. Turkish's vitality is moderate and regionally growing."],
[14,8,"Sanskrit has an estimated 25,000 first-language speakers (a figure that is disputed, with some counts higher). It is taught in approximately 14,000 schools in India and used in Hindu liturgy daily by hundreds of millions — though as a liturgical language rather than a conversational one. Revival movements include Sanskrit-speaking villages and a Duolingo course. Some argue Sanskrit is reviving, and the efforts are real but the scale remains tiny: 25,000 native speakers is comparable to an endangered language. Liturgical use keeps it culturally alive but not linguistically living in any standard sense."],
[15,5,"Latin has zero native speakers. It is the official language of Vatican City and is estimated to have about 20,000 active speakers worldwide. Approximately 3 million people are learning Latin on Duolingo. Scientific, medical, and legal nomenclature keeps Latin terms in daily professional use globally. Some argue Latin is everywhere — legal terms, medical terms, scientific names — and this is true of Latin VOCABULARY. But Latin as a LIVING LANGUAGE is effectively nowhere: no community speaks it natively, and it persists as terminology and as an academic subject rather than as a medium of daily communication."],
[12,38,"Hebrew has roughly 9 million speakers, almost entirely in Israel, with smaller diaspora communities. It is the official language of one country. The Israeli literary, tech, and media ecosystems are vibrant — Israel produces significant academic output, a lively literary scene, and a major tech industry operating in Hebrew. However, the geographic footprint is tiny — essentially one small country — and Hebrew is rarely studied as a second language outside of Jewish communities. The revival from near-death to a thriving national language is the most successful language revitalization in history, but the speaker base remains small compared to most languages on this list. Hebrew's vitality is secure domestically but limited internationally."],
[16,2,"Classical Greek has zero native speakers — Modern Greek is a different language, roughly as different from Ancient Greek as Italian is from Latin. Ancient Greek is studied academically by an estimated 100,000 or more students worldwide and remains required for theology, philosophy, and classical studies. Some note that Modern Greek preserves a great deal of Ancient Greek vocabulary, which is true — but phonology, syntax, and much morphology have changed dramatically, and the two are not mutually intelligible. Ancient Greek is studied; Modern Greek is spoken. They are not the same language, making Classical Greek the most completely 'dead' entry on this list."]
]
];

function placementNote(ai, li) {
  const rank = D[ai][li][0];
  const score = D[ai][li][1];
  
  const sorted = L.map((name, idx) => ({
    name, idx, rank: D[ai][idx][0], score: D[ai][idx][1]
  })).sort((a, b) => a.rank - b.rank);
  
  const pos = sorted.findIndex(s => s.idx === li);
  const above = pos > 0 ? sorted[pos - 1] : null;
  const below = pos < sorted.length - 1 ? sorted[pos + 1] : null;
  
  // Score context
  let scoreCtx = "Score: " + score + "/100 (rank #" + rank + "/15). ";
  if (above && below) {
    scoreCtx += above.name + " (#" + above.rank + ") scores " + above.score + " above; " +
                below.name + " (#" + below.rank + ") scores " + below.score + " below. ";
  } else if (above) {
    scoreCtx += above.name + " (#" + above.rank + ", " + above.score + ") is the nearest competitor above. ";
  } else if (below) {
    scoreCtx += below.name + " (#" + below.rank + ", " + below.score + ") is the nearest competitor below. ";
  }
  
  // Substantive reason
  const reason = (REASONS[ai] && REASONS[ai][li]) ? REASONS[ai][li] : "";
  
  return scoreCtx + reason;
}

"Latin occupies the middle of the overall rankings — below the living languages with broad strengths, above the living languages with concentrated weaknesses. Its profile is that of a solidly rich classical language without any single axis of dominance: strong literary tradition (#6, 2,200 years from Virgil through medieval continuation), solid morphology (#6, 6 cases, deponent verbs), decent grammatical expressiveness (#8, ablative absolute, gerundive), and frozen continuity (#3, the studied form is unchanged). But Latin is outmatched by Sanskrit on morphology (72 noun cells vs. ~36), by Greek on grammatical expressiveness (optative, middle voice, discourse particles), and by Arabic on lexical generativity (root system). Its vitality is near-zero (#14, no native speakers). Latin's overall position reflects a language that was genuinely rich — richer than most modern European languages — but that existed in the shadow of Greek's more innovative grammar and Sanskrit's more elaborate morphology. The 'all languages are equally rich' argument is complicated by Latin's relationship to its descendants: Latin had 6 cases; French, its descendant, has zero. Latin had 3 moods; French's subjunctive is declining. Languages can and do LOSE structural richness over time. Modern French is measurably less structurally rich than the Latin it evolved from.",
"Hebrew occupies a unique position in this matrix as the only revived language — a 3,000-year-old language that died as a native tongue around the 2nd century CE and was deliberately brought back to life in the late 19th century. Its overall placement in the lower middle reflects this dual nature: ancient depth combined with modern simplification. Hebrew's genuine strengths are its literary tradition (#7, 3,000 years from the Torah through Agnon's Nobel to contemporary fiction), its writing system (#6, an abjad with the same productive ambiguity mechanism as Arabic), its diachronic continuity (#5, modern speakers can access 3,000-year-old texts — more historical depth than most living languages), and its morphological system (#7, Semitic root-and-pattern binyanim). Its weaknesses reflect deliberate modernization: simplified grammar (#12, loss of case system and consecutive tenses from Biblical Hebrew), egalitarian social encoding (#13, no formal/informal distinction — a product of Zionist ideology), and small vitality footprint (#12, 9 million speakers in one country). The 'all languages are equally rich' argument meets an interesting case with Hebrew: it was measurably RICHER 2,000 years ago (Biblical Hebrew had more morphological complexity, more phonological distinctions, more grammatical forced categories) than it is today. The revival traded structural richness for accessibility and modernity — a deliberate, successful choice, but one that makes Hebrew measurably less structurally complex than its own ancestor.",
"Ancient Greek ranks fourth overall — the highest of any European language on this list — because it combines world-class literary tradition (#3, 2,800 years, foundation of 5+ major genres), exceptional grammatical expressiveness (#5, optative mood, middle voice, 20 discourse particles), strong morphology (#4, dual number, 7 tense-aspects, 3 voices, 4 moods), a wide precision-to-ambiguity range (#4, Aristotle's logic to Socratic irony), and the historically revolutionary Greek alphabet (#8). Its weakness profile is specific: minimal social encoding (#14, Greek democratic ideals favored equal address) and zero vitality (#15, the most completely dead language here). Greek's discourse particle system deserves special emphasis: roughly 20 small words (μέν, δέ, ἄν, γε, τοι, δή, and others) that modulate assertion, contrast, emphasis, shared knowledge, and speaker attitude with a precision unmatched by any other language's grammatical toolkit. Greek scholars had to invent new terminology to describe what these particles do because no other linguistic tradition had analyzed anything comparable. The 'all languages are equally rich' argument faces an awkward fact with Greek: Modern Greek, its descendant, has lost the dual number, the optative mood, the middle voice as a distinct category, most discourse particles, and the pitch accent system. Ancient Greek had structural resources that its own descendant no longer possesses. Languages are not equally rich — they can become less rich over time, and the difference is measurable."
];


const ALPHA=L.map((_,i)=>i).sort((a,b)=>L[a].localeCompare(L[b]));

function deathMult(li){if(DEAD_YRS[li]===0)return 1;return Math.max(0.05,1-DEAD_YRS[li]/MAX_DEAD)}

function cellTier(val,m){
  if(m==="score"){if(val>=80)return"Top";if(val>=60)return"Strong";if(val>=35)return"Mid";return"Lower"}
  else{if(val>=13)return"Top";if(val>=10)return"Strong";if(val>=6)return"Mid";return"Lower"}
}

function langOverallTier(li,scored){
  const pos=scored.findIndex(o=>o.i===li);
  if(pos<4)return"Top";
  if(pos<8)return"Strong";
  if(pos<12)return"Mid";
  return"Lower";
}

function langMatchesTiers(li,m,tiers,scored){
  if(tiers.size===0)return true;
  return tiers.has(langOverallTier(li,scored));
}

function catOf(ai) {
  for (const [label, indices] of CATS) {
    if (indices.includes(ai)) return label;
  }
  return "";
}
function catColor(cat, th) {
  const m = {
    "Structure": { bg: th.catStruct, bd: th.catStructBd, tx: th.catStructTx },
    "Expression": { bg: th.catExpr, bd: th.catExprBd, tx: th.catExprTx },
    "Heritage": { bg: th.catHeritage, bd: th.catHeritageBd, tx: th.catHeritageTx },
    "Ecology": { bg: th.catEco, bd: th.catEcoBd, tx: th.catEcoTx },
  };
  return m[cat] || { bg: "transparent", bd: "transparent", tx: th.textDim };
}
function cellVal(ai,li,m){return m==="score"?D[ai][li][1]:(17-D[ai][li][0])}
function cellRank(ai,li){return D[ai][li][0]}
function total(li,m){let s=0;for(let a=0;a<NA;a++)s+=cellVal(a,li,m);return s}
function adjTotal(li,m){return Math.round(total(li,m)*deathMult(li))}

function sColor(val,m,th){
  const mx=m==="score"?100:15;
  const t=Math.max(0,Math.min(1,val/mx));
  let tc,bc;
  if(t>0.82){tc=th.cellTop;bc=th.cellTopBd}
  else if(t>0.62){tc=th.cellStrong;bc=th.cellStrongBd}
  else if(t>0.36){tc=th.cellMid;bc=th.cellMidBd}
  else{tc=th.cellLow;bc=th.cellLowBd}
  return{bg:th.cellBg(t),text:tc,border:bc}
}

function App(){
  const[sel,setSel]=useState(null);
  const[axI,setAxI]=useState(null);
  const[sort,setSort]=useState(true);
  const[showAdj,setShowAdj]=useState(false);
  const[mode,setMode]=useState("score");
  const[dark,setDark]=useState(true);
  const[hRow,setHRow]=useState(null);
  const[hCol,setHCol]=useState(null);
  const[overallSel,setOverallSel]=useState(null);
  const[filterTiers,setFilterTiers]=useState(new Set());
  const[enabledCats,setEnabledCats]=useState(new Set(["Structure","Expression","Heritage","Ecology"]));

  const th=THEMES[dark?"dark":"light"];
  const tagC=k=>({modern:th.modern,ancient:th.ancient,dead:th.dead}[k]);
  const tagLb=k=>({modern:"",ancient:"◆",dead:"†"}[k]);

  const enabledAxes=new Set();
  for(const[label,indices]of CATS){if(enabledCats.has(label))indices.forEach(i=>enabledAxes.add(i))}
  const filteredTotal=(li,m)=>{let s=0;for(let a=0;a<NA;a++){if(enabledAxes.has(a))s+=cellVal(a,li,m)}return s};
  const filteredAdjTotal=(li,m)=>Math.round(filteredTotal(li,m)*deathMult(li));
  const fn=li=>showAdj?filteredAdjTotal(li,mode):filteredTotal(li,mode);
  const scored=L.map((_,i)=>({i,s:fn(i)})).sort((a,b)=>b.s-a.s);
  const order=sort?scored.map(o=>o.i):ALPHA;
  const maxT=mode==="score"?enabledAxes.size*100:enabledAxes.size*16;

  const btn=(on,abg,abd,atx)=>({
    fontSize:11,padding:"7px 12px",background:on?abg:th.bg3,
    border:`1px solid ${on?abd:th.border}`,borderRadius:4,
    color:on?atx:th.textDim,cursor:"pointer",fontFamily:"'Atkinson Hyperlegible',sans-serif",fontWeight:600,transition:"all 0.15s",
  });

  return(
  <div style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",color:th.text,background:th.bg,minHeight:"100vh",padding:"20px 10px",transition:"background 0.3s,color 0.3s"}}>
  <div style={{maxWidth:1100,margin:"0 auto"}}>
    <div style={{marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:700,margin:0,color:th.textBright}}>Language Richness Matrix</h1>
        <p style={{fontSize:13,margin:"5px 0 0",color:th.textDim}}>
          16 languages · 13 axes across 4 categories · {mode==="rank"?"Rank 1–15":"Score 0–100"} · Tap cell for stats & objection handling
        </p>
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>setDark(!dark)} style={{fontSize:15,padding:"3px 10px",background:th.bg3,border:`1px solid ${th.border}`,borderRadius:4,cursor:"pointer",color:th.text,fontFamily:"inherit",lineHeight:1.2}}>{dark?"☀":"☾"}</button>
        <button onClick={()=>setMode(mode==="rank"?"score":"rank")} style={btn(mode==="score",th.greenBg,th.greenBorder,th.greenText)}>{mode==="score"?"Score":"Rank"}</button>
        <button onClick={()=>setSort(!sort)} style={btn(sort,th.accentBg,th.accent,th.accentText)}>{sort?"✓ Sorted":"Sort"}</button>
        <button onClick={()=>setShowAdj(!showAdj)} style={btn(showAdj,th.purpleBg,th.purpleBorder,th.purpleText)}>{showAdj?"✓ Death ×":"Death ×"}</button>
      </div>
    </div>
    <div style={{overflowX:"auto",marginBottom:12}} onMouseLeave={()=>{setHRow(null);setHCol(null)}}>
    <table style={{borderCollapse:"separate",borderSpacing:2,width:"100%",minWidth:980,fontSize:12}}>
    <thead>
    <tr>
      <th rowSpan={2} style={{textAlign:"left",padding:"7px 5px",fontSize:11,color:th.textDim,fontWeight:600,position:"sticky",left:0,background:th.bg,zIndex:4,minWidth:108,verticalAlign:"bottom"}}>LANGUAGE</th>
      {CATS.map(([label, indices])=>{
        const cc=catColor(label,th);
        const enabled=enabledCats.has(label);
        const toggle=()=>{const next=new Set(enabledCats);if(next.has(label)){if(next.size>1)next.delete(label)}else next.add(label);setEnabledCats(next)};
        return <th key={label} colSpan={indices.length} onClick={toggle}
          style={{textAlign:"center",padding:"5px 4px",fontSize:10,fontWeight:700,letterSpacing:"0.06em",color:enabled?cc.tx:th.textVFaint,background:enabled?cc.bg:"transparent",borderBottom:`2px solid ${enabled?cc.bd:th.borderDim}`,borderRadius:"4px 4px 0 0",cursor:"pointer",transition:"all 0.2s",userSelect:"none",opacity:enabled?1:0.35}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
            <span style={{width:12,height:12,borderRadius:2,border:`1.5px solid ${enabled?cc.tx:th.textVFaint}`,background:enabled?cc.tx:"transparent",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,color:enabled?(dark?th.bg:"#fff"):"transparent",lineHeight:1}}>{enabled?"✓":""}</span>
            {label.toUpperCase()}
          </span>
        </th>
      })}
      <th rowSpan={2} style={{textAlign:"center",padding:"7px 4px",fontSize:14,color:th.textBright,fontWeight:800,whiteSpace:"nowrap",verticalAlign:"bottom"}}>{showAdj?"ADJ":"Σ"}</th>
    </tr>
    <tr>
      {AX_ORDER.map(ai=>{
        const cc=catColor(catOf(ai),th);
        const axEnabled=enabledAxes.has(ai);
        const isHC=hCol===ai;
        return <th key={ai} onClick={()=>setAxI(axI===ai?null:ai)} onMouseEnter={()=>setHCol(ai)} onMouseLeave={()=>setHCol(null)}
          style={{textAlign:"center",padding:"6px 3px",fontSize:10,color:axEnabled?th.textBright:th.textVFaint,fontWeight:700,cursor:"pointer",maxWidth:78,lineHeight:1.3,borderBottom:axI===ai?`2px solid ${th.accent}`:isHC?`2px solid ${cc.tx}`:`1px solid ${axEnabled?cc.bd:th.borderDim}`,background:isHC&&axEnabled?cc.bg:axEnabled?cc.bg:"transparent",transition:"all 0.15s",opacity:axEnabled?1:0.3}} title={AX_D[ai]}>{AX[ai].toUpperCase()}</th>
      })}
    </tr>
    </thead>
    <tbody>
    {order.map((li,ri)=>{
      const ts=fn(li);const pos=scored.findIndex(o=>o.i===li)+1;
      const tg=TAGS[li];const dm=deathMult(li);const isHR=hRow===li;const isSR=sel&&sel.l===li;
      const rowDimmed=filterTiers.size>0&&!langMatchesTiers(li,mode,filterTiers,scored);
      return(
      <tr key={li} onMouseEnter={()=>setHRow(li)} onMouseLeave={()=>setHRow(null)} style={{opacity:rowDimmed?0.2:1,transition:"opacity 0.2s"}}>
        <td style={{padding:"5px 5px",fontWeight:700,fontSize:13,position:"sticky",left:0,background:isHR?th.rowHover:th.bg,zIndex:2,whiteSpace:"nowrap",color:tagC(tg),transition:"background 0.1s",borderLeft:isSR?`2px solid ${th.accent}`:"2px solid transparent"}}>
          {sort&&<span style={{color:pos<=3?th.cellTop:pos<=6?th.cellStrong:th.textDim,marginRight:5,fontSize:11,fontWeight:700}}>#{pos}</span>}
          {L[li]}{tagLb(tg)&&<span style={{fontSize:9,marginLeft:4}}>{tagLb(tg)}</span>}
          {showAdj&&dm<1&&<span style={{fontSize:10,color:th.dead,marginLeft:4}}>×{dm.toFixed(2)}</span>}
        </td>
        {AX_ORDER.map(ai=>{
          const v=cellVal(ai,li,mode);const st=sColor(v,mode,th);const cc=catColor(catOf(ai),th);
          const axEnabled=enabledAxes.has(ai);
          const isSel=sel&&sel.a===ai&&sel.l===li;const isHC=hCol===ai;const cross=isHR&&isHC;
          const colHighlight=isHC&&axEnabled;
          return(
          <td key={ai} onClick={()=>setSel(isSel?null:{a:ai,l:li})} onMouseEnter={()=>setHCol(ai)}
            style={{textAlign:"center",padding:1,cursor:"pointer",background:colHighlight?cc.bg:isHR?th.rowHover:axEnabled?cc.bg:"transparent",borderRadius:4,transition:"background 0.1s",opacity:axEnabled?1:0.2}}>
            <div style={{height:34,lineHeight:"34px",borderRadius:4,fontSize:mode==="score"?13:14,fontWeight:700,
              background:isSel?st.text:st.bg,color:isSel?th.bg:st.text,
              border:`1.5px solid ${isSel?st.text:cross?th.accent:colHighlight?cc.tx:st.border}`,
              transition:"all 0.1s",minWidth:mode==="score"?34:30,
              transform:cross&&!isSel?"scale(1.08)":"scale(1)",
              boxShadow:colHighlight&&!cross?`inset 0 0 0 1px ${cc.bd}`:"none",
            }}>{v}</div>
          </td>)
        })}
        <td style={{textAlign:"center",padding:"5px 3px",fontWeight:800,fontSize:14,color:showAdj&&dm<1?th.purpleText:th.textBright,background:isHR?th.rowHover:"transparent",borderRadius:4}}>{ts}</td>
      </tr>)
    })}
    </tbody></table></div>
    {axI!==null&&(
      <div style={{padding:"8px 12px",borderRadius:5,background:th.bg2,border:`1px solid ${th.border}`,marginBottom:10,fontSize:13,color:th.textMid}}>
        <strong style={{color:th.textBright}}>{AX_F[axI]}:</strong> {AX_D[axI]}
      </div>
    )}
    <div style={{display:"flex",gap:16,fontSize:13,color:th.textDim,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      {[["#1–4","Top",90],["#5–8","Strong",70],["#9–12","Mid",47],["#13–15","Lower",17]].map(([r,lb,v],i)=>{
        const st=sColor(v,"score",th);
        const active=filterTiers.has(lb);
        const toggle=()=>{const next=new Set(filterTiers);if(next.has(lb))next.delete(lb);else next.add(lb);setFilterTiers(next)};
        return(<span key={i} onClick={toggle} style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",padding:"3px 8px",borderRadius:5,border:`1.5px solid ${active?st.text:"transparent"}`,background:active?(dark?"rgba(255,255,255,0.04)":"rgba(120,80,30,0.05)"):"transparent",transition:"all 0.15s",userSelect:"none"}}>
          <span style={{width:16,height:16,borderRadius:3,background:active?st.text:st.bg,border:`1.5px solid ${active?st.text:st.border}`,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11,color:active?th.bg:st.text,fontWeight:700,transition:"all 0.15s"}}>{active?"✓":""}</span>
          <span style={{color:st.text,fontWeight:700}}>{r}</span>
          <span style={{color:active?th.text:th.textDim}}>{lb}</span>
        </span>)
      })}
      <span style={{borderLeft:`1px solid ${th.border}`,paddingLeft:10,display:"flex",gap:10,fontSize:13}}>
        <span><span style={{color:th.ancient}}>◆</span> ancient+living</span>
        <span><span style={{color:th.dead}}>†</span> dead</span>
      </span>
    </div>
    {showAdj&&(
      <div style={{padding:"10px 14px",borderRadius:5,background:th.deathBg,border:`1px solid ${th.deathBorder}`,marginBottom:12,fontSize:12,lineHeight:1.65,color:th.dead}}>
        <strong>Death multiplier</strong> penalizes dead languages proportionally to when they died on a timeline spanning from the oldest language's origin (~1500 BCE, Sanskrit) to today. A language alive now gets ×1.00. A language that died at the start of the timeline would get ×0.05 (floor). Dead languages fall linearly between these extremes based on when they died: <strong>Latin</strong> (died ~650 CE, 61% through the timeline) = <strong>×{deathMult(13).toFixed(2)}</strong> · <strong>Sanskrit</strong> (died ~100 CE, 45%) = <strong>×{deathMult(12).toFixed(2)}</strong> · <strong>Ancient Greek</strong> (died ~300 BCE, 34%) = <strong>×{deathMult(15).toFixed(2)}</strong>. Hebrew, though it ceased being spoken natively ~200 CE, was successfully revived in the late 1800s and is treated as living (×1.00). Formula: max(0.05, 1 − years_since_death ÷ {MAX_DEAD}).
      </div>
    )}
    <div style={{minHeight:60,padding:14,borderRadius:7,background:sel?th.bg2:th.bg,border:`1px solid ${sel?th.border:th.borderDim}`,transition:"all 0.2s",position:"sticky",bottom:8,zIndex:4,
      boxShadow:sel?`0 -4px 20px ${dark?"rgba(0,0,0,0.5)":"rgba(0,0,0,0.1)"}`:undefined}}>
      {sel?(()=>{
        const def=D[sel.a][sel.l][2];const v=cellVal(sel.a,sel.l,mode);const rk=cellRank(sel.a,sel.l);const sc=D[sel.a][sel.l][1];const st=sColor(v,mode,th);
        return(<>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,flexWrap:"wrap"}}>
          <span style={{background:st.text,color:th.bg,width:mode==="score"?38:30,height:34,lineHeight:"34px",textAlign:"center",borderRadius:4,fontWeight:800,fontSize:mode==="score"?14:16,display:"inline-block",flexShrink:0}}>{v}</span>
          <div style={{flex:1,minWidth:0}}>
            <span style={{fontWeight:700,fontSize:16,color:tagC(TAGS[sel.l])}}>{L[sel.l]}</span>
            <span style={{color:th.textVFaint,margin:"0 6px"}}>→</span>
            <span style={{fontSize:14,color:th.textMid}}>{AX_F[sel.a]}</span>
            <span style={{fontSize:12,color:th.textDim,marginLeft:8}}>{mode==="score"?`rank #${rk}/16`:`score ${sc}/100`}</span>
          </div>
          <button onClick={()=>setSel(null)} style={{background:"transparent",border:`1px solid ${th.border}`,borderRadius:4,color:th.textDim,cursor:"pointer",fontSize:14,padding:"3px 10px",fontFamily:"inherit",flexShrink:0}}>✕</button>
        </div>
        <p style={{fontSize:14,lineHeight:1.7,margin:0,color:th.text}}>{def}</p>
        {(()=>{
          const note=placementNote(sel.a, sel.l);
          if(!note) return null;
          return <p style={{fontSize:13,lineHeight:1.6,margin:"12px 0 0",padding:"10px 14px",borderRadius:6,background:dark?"rgba(255,255,255,0.025)":"rgba(120,80,30,0.04)",border:"1px solid "+th.border,color:th.textMid}}>
            <strong style={{color:th.textBright}}>Relative placement:</strong> {note}
          </p>
        })()}
        </>)
      })():(
        <p style={{fontSize:13,color:th.textVFaint,margin:0,textAlign:"center",padding:"8px 0"}}>Tap any cell for stats, defense, and objection handling</p>
      )}
    </div>
    <div style={{marginTop:16,padding:14,borderRadius:7,background:th.bg2,border:`1px solid ${th.border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h2 style={{fontSize:12,letterSpacing:"0.05em",color:th.textDim,margin:0,fontWeight:600}}>OVERALL{showAdj?" (DEATH-ADJUSTED)":""}{mode==="score"?" — SCORES":" — RANKS"}</h2>
        <span style={{fontSize:11,color:th.textDim}}>Max: {showAdj?"varies":mode==="score"?(enabledAxes.size*100):(enabledAxes.size*16)}</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>
        {scored.map((o,i)=>{
          const pct=Math.max(3,(o.s/maxT)*100);const tg=TAGS[o.i];const t=o.s/maxT;
          const bc=t>0.6?th.cellTop:t>0.45?th.cellStrong:t>0.3?th.cellMid:th.cellLow;
          const bbg=sColor(Math.round(t*100),"score",th).bg;
          return(
          <React.Fragment key={o.i}>
          <div style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",padding:"3px 0",borderRadius:4}} onClick={()=>setOverallSel(overallSel===o.i?null:o.i)}>
            <span style={{fontWeight:700,color:bc,fontSize:11,width:24,textAlign:"right",flexShrink:0}}>#{i+1}</span>
            <span style={{fontWeight:700,fontSize:13,width:110,flexShrink:0,color:tagC(tg)}}>{L[o.i]}{tagLb(tg)?` ${tagLb(tg)}`:""}</span>
            <div style={{flex:1,height:22,background:th.barBg,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:bbg,borderRadius:3,borderRight:`2px solid ${bc}`,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:5}}>
                <span style={{fontSize:9,fontWeight:700,color:bc}}>{o.s}</span>
              </div>
            </div>
            <span style={{fontSize:16,color:overallSel===o.i?bc:th.textDim,flexShrink:0,width:18,textAlign:"center",transition:"transform 0.2s, color 0.2s",transform:overallSel===o.i?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
          </div>
          {overallSel===o.i && OVERALL_DEFS[o.i] && (
            <div style={{padding:"12px 14px",marginTop:4,marginBottom:4,borderRadius:6,background:dark?"rgba(255,255,255,0.02)":"rgba(120,80,30,0.03)",border:"1px solid "+th.border,fontSize:13,lineHeight:1.7,color:th.text,marginLeft:32}}>
              {OVERALL_DEFS[o.i]}
            </div>
          )}
          </React.Fragment>)
        })}
      </div>
    </div>
  </div></div>)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
