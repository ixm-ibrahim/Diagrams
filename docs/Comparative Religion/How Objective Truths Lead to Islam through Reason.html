sparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 11px;&amp;quot;&amp;gt;.&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: left;&amp;quot;&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 25px; padding-right: 1px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 11px; color: light-dark(rgb(51, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;This node does not address the means by which we exist - and even in this counterexample, the brain exists in the jar.&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;font color=&amp;quot;#330000&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 2px;&amp;quot;&amp;gt;&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;div style=&amp;quot;padding-left: 1px; padding-right: 1px;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(77, 77, 77);&amp;quot;&amp;gt;&amp;lt;b style=&amp;quot;background-color: transparent; font-size: 11px;&amp;quot;&amp;gt;2.&amp;lt;/b&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; font-size: 11px;&amp;quot;&amp;gt;&amp;amp;nbsp;This is a logical argument, and the mind is susceptible to&amp;lt;br&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp; mistakes. Therefore, we can&amp;#39;t fully trust anything the mind&amp;lt;br&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp; concludes, including our own existence&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 11px;&amp;quot;&amp;gt;.&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 25px; padding-right: 1px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 11px; color: light-dark(rgb(51, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;This concept (and any logic, doubt, or skepticism) is a mental sensation, which requires one to exist and thus invalidates the argument itself. Furthermore, this presupposes both our own existence and the existence of the mind - which also invalidates the argument that they don&amp;#39;t exist.&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;shape=process;whiteSpace=wrap;html=1;backgroundOutline=1;fontFamily=Helvetica;fontSize=1;labelBackgroundColor=none;fillColor=#f5f5f5;gradientColor=#b3b3b3;strokeColor=#666666;verticalAlign=top;size=0.043478260869565216;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;-50\&quot; y=\&quot;310\&quot; width=\&quot;360\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FJX189DDfgS289pbAnCB-3\&quot; style=\&quot;edgeStyle=elbowEdgeStyle;shape=connector;curved=0;rounded=1;orthogonalLoop=1;jettySize=auto;elbow=vertical;html=1;entryX=0;entryY=0.5;entryDx=0;entryDy=0;strokeColor=default;strokeWidth=2;align=center;verticalAlign=middle;fontFamily=Helvetica;fontSize=11;fontColor=default;labelBackgroundColor=default;endArrow=classic;exitX=1;exitY=0.5;exitDx=0;exitDy=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; target=\&quot;FJX189DDfgS289pbAnCB-4\&quot; source=\&quot;hU9yVLdhYgLbUcQZa_KH-4\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;740\&quot; y=\&quot;410\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FJX189DDfgS289pbAnCB-4\&quot; value=\&quot;&amp;lt;b style=&amp;quot;&amp;quot;&amp;gt;&amp;lt;font style=&am bsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;div style=&amp;quot;text-align: left; padding-left: 1px; padding-right: 1px;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(77, 77, 77);&amp;quot;&amp;gt;&amp;lt;font&amp;gt;&amp;lt;span style=&amp;quot;font-size: 11px;&amp;quot;&amp;gt;Any attempt to&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;span style=&amp;quot;font-size: 11px; background-color: transparent; color: rgb(77, 77, 77);&amp;quot;&amp;gt;&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;font-size: 11px; background-color: transparent; color: rgb(77, 77, 77);&amp;quot;&amp;gt;rationally&amp;lt;/span&amp;gt;&amp;lt;font style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;font-size: 11px;&amp;quot;&amp;gt;&amp;amp;nbsp;prove that one doesn&amp;#39;t exist (formally, &amp;quot;I do not exist&amp;quot;) is fundamentally self-defeating, for it presupposes the existence of an agent performing the attempt - thus one must exist. Furthermore, considering that existence is dependent on the experiential/sensual axioms,&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; font-size: 11px; color: rgb(77, 77, 77);&amp;quot;&amp;gt;our non-existence necessarily requires those sensations to not occur.&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: left;&amp;quot;&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 25px; padding-right: 1px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 11px; color: light-dark(rgb(51, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;It is fallacious to rationally invalidate the concept of any &amp;quot;sensual experience&amp;quot; (including one&amp;#39;s own existence), as doing so results in contradictory reasoning in which it&amp;#39;s used to disprove itself.&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;shape=process;whiteSpace=wrap;html=1;backgroundOutline=1;fontFamily=Helvetica;fontSize=1;labelBackgroundColor=none;fillColor=#f5f5f5;gradientColor=#b3b3b3;strokeColor=#666666;verticalAlign=top;size=0.043478260869565216;gradientDirection=north;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;860\&quot; y=\&quot;325\&quot; width=\&quot;340\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;q161BaAn_xV_oLcZQyov-3\&quot; value=\&quot;&amp;lt;ul style=&amp;quot;padding-left: 25px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;believing in your own non-existence is irrational&amp;lt;/li&amp;gt;&amp;lt;li style=&amp;quot;&amp;quot;&amp;gt;there are concepts thare are objectively true&amp;lt;/li&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 25px;&amp;quot;&amp;gt;&amp;lt;li style=&amp;quot;&amp;quot;&amp;gt;this requires logic to exist&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li style=&amp;quot;&amp;quot;&amp;gt;logic to model the world is sound&amp;lt;/li&amp;gt;&amp;lt;li style=&amp;quot;&amp;quot;&amp;gt;information exists&amp;lt;/li&amp;gt;&amp;lt;li style=&amp;quot;&amp;quot;&amp;gt;axioms and premises&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/ul&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;resizable=0;points=[];autosize=1;strokeColor=none;fillColor=none;fontFamily=Helvetica;fontSize=11;fontColor=default;labelBackgroundColor=default;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;-30\&quot; y=\&quot;548\&quot; width=\&quot;280\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;q161BaAn_xV_oLcZQyov-8\&quot; value=\&quot;&amp;lt;div style=&amp;quot;text-align: center;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Notes&amp;lt;/b&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 20px; margin-top: 4px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;font&amp;gt;This node does not prove any existence besides one&amp;#39;s own existence&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 20px; margin-bottom: 4px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(77, 77, 77);&amp;quot;&amp;gt;The node is premised on the occurance of physical sensations, which can only be experienced for oneself&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(77, 77, 77);&amp;quot;&amp;gt;If we can&amp;#39;t experience the sensations that others do, then this node isn&amp;#39;t enough to prove that other &amp;quot;ones&amp;quot; exist&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;li&amp;gt;The only valid way to disprove one&amp;#39;s existence is to prove that sensual/ experiential sensations do not occur&amp;lt;/li&amp;gt;&amp;lt;ul style=&amp;quot;padding-left: 20px; margin-top: 0px; padding-bottom: 4px;&amp;quot;&amp;gt;&amp;lt;li&amp;gt;&amp;lt;font style=&amp;quot;color: rgb(77, 77, 77);&amp;quot;&amp;gt;However, it is impossible to make a sound argument against one&amp;#39;s own existence, for the very act of disproving requires thought and contemplation - thus requiring one&amp;#39;s existence to perform.&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;This node is true so long as these sensations occur (one cannot verify their own existence if they can&amp;#39;t sense, feel, or think anything)&amp;lt;/span&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fontFamily=Helvetica;fontSize=11;labelBackgroundColor=none;align=left;fillColor=#e6d0de;gradientColor=#d5739d;strokeColor=#996185;gradientDirection=north;verticalAlign=top;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;400\&quot; y=\&quot;600\&quot; width=\&quot;370\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n&lt;/mxfile&gt;\n&quot;}"></div>
