<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0e0f;
    --surface:   #161618;
    --border:    #2a2a2e;
    --text:      #d4ceC8;
    --muted:     #6b6670;
    --gold:      #c9a84c;
    --gold-dim:  rgba(201,168,76,0.12);
    --red:       #c0544a;
    --green:     #4a8c6f;
    --blue:      #4a72a8;
    --orange:    #b8723a;
    --purple:    #7a5ca8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Layout ── */
  .shell {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 52px;
  }
  .crest {
    display: inline-block;
    width: 48px; height: 48px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    line-height: 46px;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #ede8e0;
    line-height: 1.1;
  }
  .tagline {
    margin-top: 8px;
    font-size: 0.83rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Divider ── */
  .rule {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0;
  }
  .rule::before, .rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .rule span {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Input area ── */
  .input-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .input-label {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }
  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    line-height: 1.65;
    min-height: 80px;
  }
  textarea::placeholder { color: var(--muted); }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .member-toggles {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toggle {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .toggle.active { color: var(--bg); }

  /* member colors for toggles */
  .toggle[data-role="devil"].active   { background: var(--red);    border-color: var(--red);    }
  .toggle[data-role="steel"].active   { background: var(--green);  border-color: var(--green);  }
  .toggle[data-role="first"].active   { background: var(--blue);   border-color: var(--blue);   }
  .toggle[data-role="pragma"].active  { background: var(--orange); border-color: var(--orange); }

  .convene-btn {
    background: var(--gold);
    color: #0e0e0f;
    border: none;
    border-radius: 7px;
    padding: 9px 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .convene-btn:hover { opacity: 0.88; }
  .convene-btn:active { transform: scale(0.97); }
  .convene-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Council seats ── */
  #council {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .seat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .seat.visible { opacity: 1; transform: translateY(0); }

  .seat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .seat-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .seat-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #ede8e0;
  }
  .seat-role {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: auto;
  }

  .seat-body {
    padding: 18px 20px;
    font-size: 0.9rem;
    line-height: 1.75;
    color: #c8c2bc;
    min-height: 56px;
  }

  /* member accent colors */
  .seat[data-role="devil"] .seat-icon  { background: rgba(192,84,74,0.18); color: var(--red);    }
  .seat[data-role="steel"] .seat-icon  { background: rgba(74,140,111,0.18); color: var(--green);  }
  .seat[data-role="first"] .seat-icon  { background: rgba(74,114,168,0.18); color: var(--blue);   }
  .seat[data-role="pragma"] .seat-icon { background: rgba(184,114,58,0.18); color: var(--orange); }
  .seat[data-role="synth"] .seat-icon  { background: rgba(201,168,76,0.18); color: var(--gold);   }

  .seat[data-role="devil"]  { border-left: 3px solid var(--red);    }
  .seat[data-role="steel"]  { border-left: 3px solid var(--green);  }
  .seat[data-role="first"]  { border-left: 3px solid var(--blue);   }
  .seat[data-role="pragma"] { border-left: 3px solid var(--orange); }
  .seat[data-role="synth"]  { border-left: 3px solid var(--gold);   }

  /* ── Typing indicator ── */
  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1;   }
  }

  /* ── Reset btn ── */
  #reset-btn {
    display: none;
    margin: 32px auto 0;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 8px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #reset-btn:hover { color: var(--text); border-color: var(--text); }

  /* ── Error ── */
  .error-msg {
    background: rgba(192,84,74,0.1);
    border: 1px solid rgba(192,84,74,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: #e08080;
    margin-top: 16px;
    display: none;
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="crest">⚖</div>
    <h1>The Council</h1>
    <p class="tagline">Multi-perspective AI deliberation</p>
  </header>

  <div class="input-block">
    <label class="input-label" for="question">Bring your question before the council</label>
    <textarea id="question" rows="3" placeholder="e.g. Should I quit my job to start a company? / What are the real tradeoffs of remote work? / Is my product idea viable?"></textarea>
    <div class="input-footer">
      <div class="member-toggles" id="toggles"></div>
      <button class="convene-btn" id="convene-btn" onclick="convene()">Convene</button>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div id="council"></div>
  <button id="reset-btn" onclick="resetCouncil()">↩ New Question</button>

</div>

<script>
const MEMBERS = [
  {
    role: 'devil',
    name: 'The Skeptic',
    label: 'Devil\'s Advocate',
    icon: '🗡',
    system: `You are a sharp devil's advocate on a deliberation council. Your job is to identify every flaw, risk, blind spot, and reason something might fail. Be genuinely critical — not performatively balanced. You may reference what others have said before you if it helps sharpen your critique. Respond in 3–5 focused paragraphs. No bullet lists.`
  },
  {
    role: 'steel',
    name: 'The Champion',
    label: 'Steelman',
    icon: '🛡',
    system: `You are a steelman advocate on a deliberation council. Your job is to construct the strongest possible case FOR the idea or position — even if you personally have doubts. Surface the best arguments, best-case scenarios, and underappreciated upsides. You may note where the Skeptic's critique has merit, but primarily make the affirmative case. Respond in 3–5 focused paragraphs. No bullet lists.`
  },
  {
    role: 'first',
    name: 'The Reasoner',
    label: 'First Principles',
    icon: '🔬',
    system: `You are a first-principles thinker on a deliberation council. Strip away assumptions and conventions. Ask: what is actually true here from the ground up? What are the fundamental dynamics at play? You may respond to what others have said, but primarily reason independently from foundational truths. Respond in 3–5 focused paragraphs. No bullet lists.`
  },
  {
    role: 'pragma',
    name: 'The Pragmatist',
    label: 'Pragmatist',
    icon: '⚙',
    system: `You are a pragmatist on a deliberation council. You only care about what's actually actionable in the real world, given real constraints of time, money, energy, and human nature. Cut through abstract debate and focus on: what can realistically be done, and what does the person actually need to decide or do? You may draw on what others said. Respond in 3–5 focused paragraphs. No bullet lists.`
  }
];

const SYNTH = {
  role: 'synth',
  name: 'The Arbiter',
  label: 'Synthesis',
  icon: '⚖',
  system: `You are the Arbiter — the final voice on a deliberation council. You have heard all perspectives. Your job is to synthesize: where did council members agree? Where did they genuinely disagree, and why? What is the most honest overall picture? End with 2–3 concrete things the person should actually consider or do. Respond in 4–6 paragraphs. No bullet lists.`
};

// State
let activeRoles = new Set(['devil','steel','first','pragma']);

// Build toggles
const toggleContainer = document.getElementById('toggles');
MEMBERS.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'toggle active';
  btn.dataset.role = m.role;
  btn.textContent = m.label;
  btn.onclick = () => {
    if (activeRoles.has(m.role)) {
      if (activeRoles.size <= 2) return; // keep at least 2
      activeRoles.delete(m.role);
      btn.classList.remove('active');
    } else {
      activeRoles.add(m.role);
      btn.classList.add('active');
    }
  };
  toggleContainer.appendChild(btn);
});

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

function resetCouncil() {
  document.getElementById('council').innerHTML = '';
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('question').value = '';
  document.getElementById('convene-btn').disabled = false;
  document.getElementById('question').focus();
  hideError();
}

function createSeat(member) {
  const seat = document.createElement('div');
  seat.className = 'seat';
  seat.dataset.role = member.role;
  seat.innerHTML = `
    <div class="seat-header">
      <div class="seat-icon">${member.icon}</div>
      <div class="seat-name">${member.name}</div>
      <div class="seat-role">${member.label}</div>
    </div>
    <div class="seat-body">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  document.getElementById('council').appendChild(seat);
  // trigger animation next frame
  requestAnimationFrame(() => requestAnimationFrame(() => seat.classList.add('visible')));
  return seat;
}

function setSeatText(seat, text) {
  seat.querySelector('.seat-body').textContent = text;
}

async function callClaude(systemPrompt, userContent) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userContent }]
    })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${response.status}`);
  }
  const data = await response.json();
  return data.content.map(b => b.text || '').join('');
}

async function convene() {
  const question = document.getElementById('question').value.trim();
  if (!question) return;
  hideError();

  const btn = document.getElementById('convene-btn');
  btn.disabled = true;
  document.getElementById('council').innerHTML = '';
  document.getElementById('reset-btn').style.display = 'none';

  const selected = MEMBERS.filter(m => activeRoles.has(m.role));
  const responses = []; // { name, role, label, text }

  try {
    // Each member responds, seeing all previous responses
    for (const member of selected) {
      const seat = createSeat(member);

      let userContent = `The question before the council:\n\n"${question}"`;
      if (responses.length > 0) {
        userContent += `\n\nPrevious council members have spoken:\n\n`;
        responses.forEach(r => {
          userContent += `— ${r.name} (${r.label}):\n${r.text}\n\n`;
        });
        userContent += `Now give your perspective.`;
      }

      const text = await callClaude(member.system, userContent);
      setSeatText(seat, text);
      responses.push({ ...member, text });
    }

    // Synthesizer
    const synthSeat = createSeat(SYNTH);
    let synthContent = `The question before the council:\n\n"${question}"\n\nThe council has deliberated:\n\n`;
    responses.forEach(r => {
      synthContent += `— ${r.name} (${r.label}):\n${r.text}\n\n`;
    });
    synthContent += `Now deliver your synthesis.`;

    const synthText = await callClaude(SYNTH.system, synthContent);
    setSeatText(synthSeat, synthText);

    document.getElementById('reset-btn').style.display = 'block';

  } catch (err) {
    showError(`The council encountered an error: ${err.message}`);
    btn.disabled = false;
  }
}

// Enter key (Ctrl/Cmd + Enter) to submit
document.getElementById('question').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') convene();
});
</script>
</body>
</html>
